name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && "${{ github.event_name }}" != "pull_request" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindnote.jks"
            chmod 600 "$RUNNER_TEMP/mindnote.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require signing for tagged release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        run: |
          echo 'Configure Android signing secrets before publishing an APK release.' >&2
          exit 1
      - name: Build signed APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mindnote.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Build development APK
        if: steps.signing.outputs.signed != 'true'
        run: gradle -p android --no-daemon assembleDebug
      - name: Package APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p artifacts
          if [[ "$SIGNED" == 'true' ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/mindnote.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/mindnote.apk > artifacts/SIGNING-CERTIFICATE.txt
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/mindnote-development.apk
          fi
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mindnote-apk-${{ github.run_number }}
          path: artifacts/
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mindnote.jks"
  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mindnote-apk-${{ github.run_number }}
          path: artifacts
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" artifacts/mindnote.apk artifacts/SHA256SUMS.txt artifacts/SIGNING-CERTIFICATE.txt --target "$RELEASE_SHA" --title "Mindnote $RELEASE_TAG" --generate-notes
